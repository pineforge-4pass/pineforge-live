name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.12', '3.13', '3.14']
        include:
          - os: macos-latest
            python: '3.12'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install -e '.[dev,websocket]'
      - name: Run offline tests
        # Engine fixtures skip explicitly. Campaign probe execution belongs to
        # the separate Cloud Run verification workflow, not public fork CI.
        run: env -u PINEFORGE_ENGINE_ROOT python -m pytest

  export-tests:
    name: Campaign export unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Test export helpers with in-memory fixtures
        run: node --test tests/test_export_campaign.mjs

  package:
    name: Distribution and license metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build source and wheel distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Check packaged license files and metadata
        run: |
          python - <<'PY'
          from email.parser import BytesParser
          from pathlib import Path
          import tarfile
          import zipfile

          dist = Path('dist')
          wheels = list(dist.glob('*.whl'))
          sources = list(dist.glob('*.tar.gz'))
          assert len(wheels) == len(sources) == 1, 'expected one wheel and one sdist'
          expected = {name: Path(name).read_bytes() for name in ('LICENSE', 'NOTICE')}

          with zipfile.ZipFile(wheels[0]) as archive:
              metadata_paths = [name for name in archive.namelist() if name.endswith('.dist-info/METADATA')]
              assert len(metadata_paths) == 1
              metadata_path = metadata_paths[0]
              metadata = BytesParser().parsebytes(archive.read(metadata_path))
              assert metadata['Name'] == 'pineforge-live'
              assert metadata['License-Expression'] == 'Apache-2.0'
              assert set(metadata.get_all('License-File', [])) == set(expected)
              prefix = metadata_path.rsplit('/', 1)[0]
              for name, content in expected.items():
                  assert archive.read(f'{prefix}/licenses/{name}') == content, name

          with tarfile.open(sources[0], 'r:gz') as archive:
              roots = {name.split('/', 1)[0] for name in archive.getnames()}
              assert len(roots) == 1
              root = roots.pop()
              package_info = archive.extractfile(f'{root}/PKG-INFO')
              assert package_info is not None
              source_metadata = BytesParser().parsebytes(package_info.read())
              assert source_metadata['Name'] == metadata['Name']
              assert source_metadata['Version'] == metadata['Version']
              assert source_metadata['License-Expression'] == 'Apache-2.0'
              assert set(source_metadata.get_all('License-File', [])) == set(expected)
              for name, content in expected.items():
                  member = archive.extractfile(f'{root}/{name}')
                  assert member is not None and member.read() == content, name
          print('Wheel and sdist preserve Apache-2.0 metadata, LICENSE and NOTICE.')
          PY
      - name: Install the wheel
        run: python -m pip install dist/*.whl
      - name: Smoke test the installed package outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -I - <<'PY'
          from importlib.metadata import distribution
          import pineforge_live

          package = distribution('pineforge-live')
          assert package.metadata['License-Expression'] == 'Apache-2.0'
          print(f'Installed pineforge-live {package.version}: {pineforge_live.__file__}')
          PY
          pineforge-live version
          pineforge-live mock-feed --help
