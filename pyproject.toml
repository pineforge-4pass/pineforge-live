[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pineforge-live"
version = "0.1.0"
description = "Broker-neutral PineForge strategy runtime with tick/bar feeds and durable webhooks"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = []
keywords = ["pineforge", "pinescript", "trading", "webhooks"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Homepage = "https://github.com/pineforge-4pass/pineforge-live"
Documentation = "https://github.com/pineforge-4pass/pineforge-live/blob/main/README.md"
Issues = "https://github.com/pineforge-4pass/pineforge-live/issues"
Source = "https://github.com/pineforge-4pass/pineforge-live"

[project.optional-dependencies]
dev = ["pytest>=8"]
websocket = ["websockets>=14,<17"]

[project.scripts]
pineforge-live = "pineforge_live.cli:main"

[tool.setuptools.packages.find]
include = ["pineforge_live*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
